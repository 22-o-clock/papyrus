[project]
name = "papyrus"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "asyncio>=4.0.0",
    "asyncpg>=0.31.0",
    "discord-py[voice]>=2.7.1",
    "dotenv>=0.9.9",
    "jaconv>=0.4.0",
    "openai>=3.6.0",
    "openpyxl>=3.1.5",
    "python-dateutil>=2.9.0.post0",
    "pykakasi>=2.3.0",
    "regex>=2024.11.6",
    "sqlalchemy>=2.0.46",
    "tiktoken>=0.14.0",
    "unidecode>=1.3.8",
]

[dependency-groups]
dev = ["ruff>=0.16.1", "ty>=0.0.12"]

[tool.uv]
# discord.py 2.7.1のvoice extraがPyNaCl 1.6系を除外するため、修正版を上流の次期制約に合わせて許可する。
override-dependencies = [
    { package = { name = "discord-py", version = "2.7.1" }, dependencies = ["pynacl>=1.6.2,<1.7"] },
]

[tool.ruff]
extend-exclude = ["cogs/chatbot/prompt"]
line-length = 128
target-version = "py313"

[tool.ruff.lint]
ignore = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D107",
    "D400",
    "D415",
    "D203",
    "D213",
    "COM812",
    "CPY001",
    "ISC001",
    "PGH003",
]
select = ["ALL"]
allowed-confusables = ["！", "？", "，"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ty.src]
exclude = ["cogs/chatbot/prompt"]
